<style>
:root{--bg:#0e1116;--card:#161b22;--line:#262d36;--tx:#e8e6e1;--mut:#9aa3ad;--acc:#d9b26f;--ok:#7fc8a0;--wa:#e7c069;--ur:#ef8a80;--cl:#8b949e}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1d2430 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 40px}
.hero{padding:22px 0 26px;border-bottom:1px solid var(--line);margin-bottom:22px}
.kicker{margin:0;color:var(--acc);letter-spacing:.18em;text-transform:uppercase;font-size:.72rem;font-weight:600}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2.6rem,9vw,4.2rem);line-height:1;margin:.25em 0 .2em;letter-spacing:-.01em}
.lead{color:var(--mut);margin:.4em 0;max-width:38em}.agg{color:var(--mut);font-size:.8rem;margin:.8em 0 0}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.wrap{padding-top:48px}}
.card{background:linear-gradient(180deg,#181e26,var(--card));border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;animation:in .5s both;animation-delay:calc(var(--i)*40ms)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;justify-content:space-between;align-items:center}
.n{font-family:Georgia,serif;color:var(--acc);font-size:.95rem}
.tag{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.tag.attivo{color:var(--ok)}.tag.attesa{color:var(--wa)}.tag.urgente{color:var(--ur)}.tag.chiuso{color:var(--cl)}
h2{font-family:Georgia,serif;font-weight:400;font-size:1.5rem;margin:.45em 0 0;line-height:1.15}
.sotto{margin:.15em 0 .7em;color:var(--mut);font-size:.88rem}
.stato{margin:0 0 14px}
.link{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--acc);color:#16120a;font-weight:600;text-decoration:none;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.url{margin:10px 0 0;color:var(--mut);font-size:.75rem;word-break:break-all}
footer{color:var(--mut);font-size:.75rem;text-align:center;margin-top:30px}
.lock{max-width:380px;margin:18vh auto 0;padding:0 18px;text-align:center}
.lock h1{font-size:3rem}.lock p{color:var(--mut)}
.lock form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.lock input{font:inherit;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0b0e12;color:var(--tx);text-align:center}
.lock button{font:inherit;font-weight:600;min-height:48px;border:0;border-radius:12px;background:var(--acc);color:#16120a}
.err{color:var(--ur);min-height:1.4em;font-size:.9rem}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function apri(pw){
 const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.v)},k,u(D.c));
